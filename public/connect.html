<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Connect ARIA</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=4" />
  <!-- The OAuth consent step for the ARIA MCP connector (mcp/src/connect.js
       is the other half). Claude sends you here through the connector's
       /authorize, with a one-time handle in the URL fragment. Sign in with
       Google, check who is asking, and press Allow.

       Dressed exactly like the lock screen: the same theme preload (your
       saved mode and accent), the same tokens and the same lock-boot.css. -->
  <script src="/js/themePreload.js"></script>
  <link rel="stylesheet" href="style/base.css" />
  <link rel="stylesheet" href="style/lock-boot.css" />
  <style>
    /* Only what the lock screen has no piece for: the list of what Claude
       gets, and a quiet Cancel beside Allow. */
    #lockScreen .connectList {
      list-style: none;
      margin: 0 0 18px;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    #lockScreen .connectList li {
      display: flex;
      gap: 10px;
      font-size: 0.8rem;
      line-height: 1.5;
      color: var(--text-2);
    }
    #lockScreen .connectList li::before {
      content: "";
      flex: none;
      width: 6px;
      height: 6px;
      margin-top: 0.55em;
      border-radius: 50%;
      background: var(--accent);
    }
    #lockScreen .connectList li.no::before {
      background: transparent;
      border: 1px solid var(--text-3);
    }
    #lockScreen .connectList li.no {
      color: var(--text-3);
    }
    #lockScreen .connectWho {
      color: var(--text);
      font-weight: 500;
    }
    #lockScreen .connectActions {
      display: flex;
      gap: 10px;
    }
    #lockScreen .connectActions .lockPrimaryBtn {
      flex: 1;
      margin-top: 0;
    }
    #lockScreen .connectCancel {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: var(--r-full, 999px);
      background: transparent;
      color: var(--text-2);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color var(--tr), color var(--tr);
    }
    #lockScreen .connectCancel:hover:not(:disabled) {
      border-color: var(--border-strong);
      color: var(--text);
    }
    #lockScreen .connectCancel:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #lockScreen .connectAccount {
      margin: 16px 0 0;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-3);
    }
    #lockScreen .connectAccount a {
      color: var(--text-3);
    }
    #lockScreen .connectAccount a:hover {
      color: var(--accent-text);
    }
  </style>
</head>
<body>
  <div id="lockScreen">
    <header class="lockBrand">
      <span class="lockDot" aria-hidden="true"></span>
      <span class="lockLogo">ARIA</span>
    </header>

    <main id="lockBox">
      <h1 class="lockTitle" id="title">Connect ARIA</h1>
      <p class="lockSub" id="sub">Checking this request…</p>
      <div id="body"></div>
      <p id="lockError" role="alert"></p>
    </main>

    <footer class="lockFoot"><span>ARIA connector</span></footer>
  </div>

  <script type="module">
    import { FIREBASE_CONFIG } from "./js/firebase-config.js";

    // Tokens only ever go to this one server, never to a URL from the
    // request, and only after an explicit click. Local testing may point it
    // elsewhere with ?server=, but only from localhost.
    const LOCAL = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    const asked = new URLSearchParams(location.search).get("server");
    const SERVER = LOCAL && asked ? asked.replace(/\/+$/, "") : "https://aria-mcp.openplan.workers.dev";
    const SDK = "https://www.gstatic.com/firebasejs/10.12.5";

    const GOOGLE_ICON = `<svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.6 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.7 6.9l7.3 5.7c4.3-3.9 6.8-9.8 6.8-17.1z"/>
      <path fill="#FBBC05" d="M10.4 28.7a14.5 14.5 0 0 1 0-9.4l-7.8-6.1a24 24 0 0 0 0 21.6l7.8-6.1z"/>
      <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.4 0-11.7-3.7-13.6-9.1l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
    </svg>`;

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const handle = new URLSearchParams(location.hash.slice(1)).get("h");
    let request = null;

    const showError = (message) => ($("lockError").textContent = message || "");

    function fail(message) {
      $("sub").textContent = "";
      $("body").innerHTML = "";
      showError(message);
    }

    async function post(path, body) {
      const res = await fetch(`${SERVER}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || `The connector answered ${res.status}.`);
      return json;
    }

    const appName = (host) => (/(^|\.)claude\.(ai|com)$/.test(host || "") ? "Claude" : host || "the app");

    function renderSignIn(sdk, auth) {
      $("title").textContent = `Connect to ${appName(request.redirectHost)}`;
      $("sub").textContent = "Sign in with the Google account you use for ARIA.";
      $("body").innerHTML = `<button id="signin" class="lockGoogleBtn" type="button">${GOOGLE_ICON}<span>Continue with Google</span></button>`;
      $("signin").addEventListener("click", async () => {
        $("signin").disabled = true;
        showError("");
        try {
          const provider = new sdk.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          await sdk.signInWithPopup(auth, provider);
        } catch (err) {
          if (err?.code !== "auth/popup-closed-by-user") showError(`Sign-in failed${err?.code ? ` (${err.code})` : ""}.`);
        } finally {
          if ($("signin")) $("signin").disabled = false;
        }
      });
    }

    function renderConsent(sdk, auth, user) {
      $("title").textContent = `Connect to ${appName(request.redirectHost)}`;
      const who = request.clientDomain || request.clientName;
      $("sub").innerHTML = `<b class="connectWho">${esc(who)}</b> wants to use your ARIA. Access goes to <b>${esc(request.redirectHost)}</b>.`;
      $("body").innerHTML = `
        <ul class="connectList">
          <li>Talk to ARIA and have it use its tools: research, Claw on your PC, Claude Code and Gemini CLI</li>
          <li>See and change your memory, reminders, journal, daily rings, background tasks and watchers</li>
          <li class="no">Anything ARIA treats as sensitive still waits for your OK in the ARIA app</li>
        </ul>
        <div class="connectActions">
          <button id="deny" class="connectCancel" type="button">Cancel</button>
          <button id="allow" class="lockPrimaryBtn" type="button">Allow</button>
        </div>
        <p class="connectAccount">Signed in as ${esc(user.email || user.displayName || "you")} · <a href="#" id="switch">use another account</a></p>`;

      $("allow").addEventListener("click", async () => {
        $("allow").disabled = true;
        $("deny").disabled = true;
        showError("");
        $("sub").textContent = "Checking with ARIA… this can take a minute if the server is waking up.";
        try {
          const idToken = await user.getIdToken(true);
          const { redirectTo } = await post("/connect/complete", { h: handle, idToken, refreshToken: user.refreshToken });
          $("title").textContent = "Connected";
          $("sub").textContent = `Taking you back to ${appName(request.redirectHost)}…`;
          $("body").innerHTML = "";
          location.assign(redirectTo);
        } catch (err) {
          fail(err.message);
        }
      });
      $("deny").addEventListener("click", async () => {
        try {
          const { redirectTo } = await post("/connect/deny", { h: handle });
          if (redirectTo) return location.assign(redirectTo);
        } catch { /* fall through */ }
        fail("Cancelled. You can close this tab.");
      });
      $("switch").addEventListener("click", async (e) => {
        e.preventDefault();
        await sdk.signOut(auth);
      });
    }

    async function start() {
      if (!/^[0-9a-f]{48}$/.test(handle || "")) {
        fail("This page opens when you connect ARIA from Claude (Settings → Connectors → Add custom connector).");
        return;
      }
      try {
        const res = await fetch(`${SERVER}/connect/info?h=${handle}`);
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || "This connection request is not valid.");
        request = body;
      } catch (err) {
        fail(err.message);
        return;
      }
      const [appSdk, sdk] = await Promise.all([import(`${SDK}/firebase-app.js`), import(`${SDK}/firebase-auth.js`)]);
      // Same named app as the lock screen (googleAuth.js), so an existing
      // Google session here is picked up without a popup.
      const auth = sdk.getAuth(appSdk.initializeApp(FIREBASE_CONFIG, "aria"));
      try { await sdk.setPersistence(auth, sdk.browserLocalPersistence); } catch { /* private window */ }
      sdk.onAuthStateChanged(auth, (user) => {
        showError("");
        if (user) renderConsent(sdk, auth, user);
        else renderSignIn(sdk, auth);
      });
    }

    start();
  </script>
</body>
</html>
